substitutions:
  friendly_name: Entrance Lamp
  hostname: entrance-lamp
  light_name: Entrance Lamp
  
esp8266:
  board: esp01_1m
  framework:
    version: recommended

packages:
  base: !include device/generic.yaml

logger:
  # Disable logging to serial
  baud_rate: 0

output:
  - platform: esp8266_pwm
    id: light_pwm
    pin: GPIO14

light:
  - platform: monochromatic
    name: "${light_name}"
    output: light_pwm
