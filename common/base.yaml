esphome:
  name: ${hostname}
  build_path: ./build/${hostname}

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: false
  reboot_timeout: 300s
  min_auth_mode: WPA2
  # domain: !secret wifi_domain

api:
  reboot_timeout: 30min
  #password: !secret api_password
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

time:
  - platform: homeassistant

sun:
  latitude: !secret lat
  longitude: !secret lng
